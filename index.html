<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusiCare — Gestionale</title>
<meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap');

:root{
  --teal:#015152; --teal-ink:#06393a; --rose:#b86577; --sky:#6f9fb0; --sage:#94a186;
  --blush:#ffebf0; --paper:#f4f5ee; --paper-deep:#e9ebde; --line:rgba(1,51,52,.14);
  --ink:#0b2e2f; --ink-soft:rgba(11,46,47,.68);
  --f-display:'Fraunces', ui-serif, Georgia, serif; --f-body:'Manrope', ui-sans-serif, system-ui, sans-serif;
  --f-script:'Caveat', cursive;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:64px; }
a{ color:inherit; } button{ font-family:inherit; cursor:pointer; }
img{ max-width:100%; }

.shell{ max-width:1180px; margin:0 auto; padding:0 22px 60px; }

/* ---------- topbar (sezioni interne) ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 0 18px; border-bottom:1px solid var(--line); margin-bottom:26px; flex-wrap:wrap; }
.brand{ display:flex; flex-direction:column; gap:2px; }
.brand .eyebrow{ font-weight:700; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--rose); }
.brand h1{ font-family:var(--f-display); font-weight:600; font-size:1.5rem; margin:0; color:var(--teal-ink); }
.top-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.back-link{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:8px 10px 8px 0; color:var(--teal-ink); font-weight:700; font-size:.88rem; }
.btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; font-weight:700; font-size:.85rem; border:none; text-decoration:none; transition:transform .15s var(--ease); }
.btn:active{ transform:scale(.97); }
.btn--solid{ background:var(--teal); color:#fdfdf9; }
.btn--outline{ background:transparent; color:var(--teal-ink); box-shadow:inset 0 0 0 1.3px var(--teal); }
.btn--ghost{ background:rgba(1,81,82,.08); color:var(--teal-ink); }
.btn--sm{ padding:7px 13px; font-size:.78rem; }

/* ---------- HOME (landing generica) ---------- */
.home-marks{ display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap; padding:38px 0 10px; }
.home-marks img{ height:40px; width:auto; }
.home-marks .mark-lara{ height:64px; }
.home-marks .mark-bwm{ height:58px; }
.home-title{ text-align:center; margin:6px 0 6px; }
.home-title .eyebrow{ font-weight:700; font-size:.76rem; letter-spacing:.14em; text-transform:uppercase; color:var(--rose); }
.home-title h1{ font-family:var(--f-display); font-weight:600; font-size:clamp(1.8rem,5vw,2.3rem); color:var(--teal-ink); margin:8px 0 4px; }
.home-title p{ font-family:var(--f-script); font-size:1.3rem; color:var(--teal); margin:0; }

.menu-list{ max-width:560px; margin:36px auto 0; display:flex; flex-direction:column; }
.menu-item{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:18px 6px; border-top:1px solid var(--line); background:none; border-left:none; border-right:none; border-bottom:none;
  text-align:left; font-family:var(--f-display); font-weight:600; font-size:1.08rem; color:var(--ink);
  transition:padding-left .2s var(--ease), color .2s var(--ease);
}
.menu-list .menu-item:last-child{ border-bottom:1px solid var(--line); }
.menu-item:hover{ padding-left:12px; color:var(--teal-ink); }
.menu-item .m-arrow{ color:var(--rose); font-family:var(--f-body); font-weight:700; }

/* ---------- footer social/contatti ---------- */
.social-footer{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(244,245,238,.94); backdrop-filter:blur(6px); border-top:1px solid var(--line);
  font-size:.78rem; font-weight:700; color:var(--teal-ink);
}
.social-footer a{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--teal-ink); }
.social-footer svg{ width:16px; height:16px; }

/* ---------- griglia dashboard ---------- */
.admin-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px; }
.stat{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
.stat .stat-label{ font-size:.7rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px; }
.stat .stat-value{ font-family:var(--f-display); font-weight:600; font-size:1.7rem; color:var(--teal-ink); margin:0; }
.stat .stat-sub{ font-size:.78rem; color:var(--ink-soft); margin-top:4px; }

.quick-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:30px; }

.section{ margin-bottom:38px; }
.section h2{ font-family:var(--f-display); font-weight:600; font-size:1.3rem; color:var(--teal-ink); margin:0 0 4px; }
.section .section-note{ font-size:.86rem; color:var(--ink-soft); margin:0 0 16px; max-width:64ch; }

.setup-note{ background:var(--blush); border:1px solid rgba(184,101,119,.25); border-radius:16px; padding:18px 20px; font-size:.88rem; color:#7a3b48; margin-bottom:16px; }
.setup-note code{ background:rgba(255,255,255,.6); padding:1px 6px; border-radius:6px; font-size:.82em; }

.family-list{ display:flex; flex-direction:column; gap:12px; }
.family-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; }
.family-card .fam-name{ font-family:var(--f-display); font-weight:600; font-size:1.05rem; color:var(--teal-ink); }
.family-card .fam-kids{ font-size:.85rem; color:var(--ink-soft); margin-top:3px; }
.family-card .fam-actions{ display:flex; gap:8px; flex-wrap:wrap; }

.table-list{ display:flex; flex-direction:column; }
.table-row{ display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; padding:14px 4px; border-top:1px solid var(--line); font-size:.9rem; }
.table-row:last-child{ border-bottom:1px solid var(--line); }
.table-row .t-main{ font-weight:700; color:var(--ink); }
.table-row .t-sub{ color:var(--ink-soft); }
.tag{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:.72rem; font-weight:700; }
.tag--warn{ background:var(--blush); color:#8a4453; }
.tag--ok{ background:#e2ece5; color:var(--teal-ink); }

.empty{ padding:26px 20px; text-align:center; color:var(--ink-soft); font-size:.9rem; border:1px dashed var(--line); border-radius:16px; }

.form-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:16px; display:flex; flex-direction:column; gap:12px; }
.form-card .f-row{ display:flex; gap:14px; flex-wrap:wrap; }
.form-card label{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:5px; font-size:.8rem; font-weight:700; color:var(--ink-soft); }
.form-card label.f-check{ flex-direction:row; align-items:center; gap:8px; font-weight:600; }
.form-card input, .form-card select{ font-family:var(--f-body); font-size:.92rem; padding:9px 11px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
.form-card input:focus, .form-card select:focus{ outline:2px solid var(--teal); outline-offset:1px; }
.form-card .btn{ align-self:flex-start; }
.form-msg{ font-size:.82rem; color:var(--teal); font-weight:700; }

/* ---------- gruppi studenti (accordion) ---------- */
.group-list{ display:flex; flex-direction:column; gap:10px; }
.group-card{ background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
.group-head{ width:100%; display:flex; justify-content:space-between; align-items:center; padding:16px 18px; background:none; border:none; text-align:left; }
.group-head .g-name{ font-family:var(--f-display); font-weight:600; font-size:1.02rem; color:var(--teal-ink); }
.group-head .g-count{ font-size:.8rem; font-weight:700; color:var(--rose); }
.group-body{ display:none; padding:0 18px 16px; }
.group-body.is-open{ display:block; }
.group-body .stu{ padding:8px 0; border-top:1px solid var(--line); font-size:.88rem; }

/* ---------- griglia orario settimanale ---------- */
.week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; overflow-x:auto; }
.week-col{ min-width:120px; }
.week-col h4{ text-align:center; font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:0 0 8px; }
.week-slot{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; font-size:.78rem; }
.week-slot .w-time{ font-weight:700; color:var(--teal-ink); }
.week-slot .w-course{ color:var(--ink-soft); }

/* ---------- calendario a griglia mensile ---------- */
.cal-month{ margin-bottom:26px; }
.cal-month h3{ font-family:var(--f-display); font-weight:600; font-size:1.05rem; color:var(--teal-ink); margin:0 0 10px; text-transform:capitalize; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal-dow{ text-align:center; font-size:.68rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; padding-bottom:4px; }
.cal-cell{ aspect-ratio:1; border-radius:10px; background:#fff; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.78rem; color:var(--ink-soft); padding:2px; }
.cal-cell.empty-cell{ background:transparent; border:none; }
.cal-cell.has-lesson{ background:var(--teal); color:#fff; border-color:var(--teal); font-weight:700; }
.cal-cell .cc-day{ font-size:.9rem; }
.cal-cell .cc-time{ font-size:.6rem; opacity:.9; }

/* ---------- home famiglia ---------- */
.fam-hero{ text-align:center; padding:10px 0 8px; }
.fam-hero .fam-eyebrow{ font-weight:700; font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; color:var(--rose); }
.fam-hero h1{ font-family:var(--f-display); font-weight:600; font-size:clamp(1.8rem,6vw,2.4rem); color:var(--teal-ink); margin:6px 0 8px; }
.fam-hero .fam-tag{ color:var(--ink-soft); max-width:44ch; margin:0 auto; }

.tabs{ display:flex; gap:6px; justify-content:center; margin:26px 0 30px; flex-wrap:wrap; }
.tab{ background:none; border:none; padding:9px 16px; border-radius:999px; font-weight:700; font-size:.84rem; color:var(--ink-soft); transition:background .2s var(--ease), color .2s var(--ease); }
.tab.is-active{ background:var(--teal); color:#fdfdf9; }
.tab-panel{ display:none; } .tab-panel.is-active{ display:block; }

.next-lesson{ background:linear-gradient(175deg,#fff,var(--paper-deep)); border:1px solid var(--line); border-radius:20px; padding:26px 24px; margin-bottom:20px; }
.next-lesson .nl-label{ font-weight:700; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--rose); margin:0 0 8px; }
.next-lesson .nl-date{ font-family:var(--f-display); font-weight:600; font-size:1.4rem; color:var(--teal-ink); margin:0 0 4px; }
.next-lesson .nl-course{ color:var(--ink-soft); }

.announce{ background:var(--blush); border:1px solid rgba(184,101,119,.25); border-radius:16px; padding:18px 20px; margin-bottom:14px; }
.announce h3{ font-family:var(--f-display); font-weight:600; font-size:1.05rem; margin:0 0 6px; color:#7a3b48; }
.announce p{ margin:0; color:#7a3b48; font-size:.9rem; }

.enroll-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:12px; }
.enroll-card .e-course{ font-weight:700; }

.pay-card{ display:flex; justify-content:space-between; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:12px; }
.pay-card.is-due{ border-color:rgba(184,101,119,.35); background:var(--blush); }
.pay-card .p-name{ font-weight:700; }
.pay-card .p-sub{ font-size:.85rem; color:var(--ink-soft); }

.song{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:10px; }
.song .s-title{ font-weight:700; } .song .s-artist{ color:var(--ink-soft); font-size:.85rem; }

.info-block{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
.info-block h3{ font-family:var(--f-display); font-weight:600; font-size:1.05rem; color:var(--teal-ink); margin:0 0 8px; }
.info-block p, .info-block li{ font-size:.9rem; color:var(--ink-soft); }
.info-block a{ color:var(--teal); font-weight:700; }

@media(max-width:600px){
  .table-row{ flex-direction:column; gap:2px; }
  .family-card{ flex-direction:column; align-items:flex-start; }
  .week-grid{ grid-template-columns:repeat(7,140px); }
}

</style>

<script>

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyb4eD96OsETN6EcVhXtUKjp02lnjXTvJz-fbOoZf9c7Zheq2x2fhgv5sDtc-uB6Ek/exec';

const ANNO_INIZIO = '2026-10-01';
const ANNO_FINE   = '2027-05-31';

const INFO = {
  telefono: '349 442 2875',
  email: 'laragardin.musicare@gmail.com',
  iban: 'IT44X0329601601000067668639',
  intestatario: 'Lara Gardin',
  formIscrizione: 'https://forms.gle/DFTtAHEXiV4s9Nq57',

  instagram: 'https://www.instagram.com/laragardin.musicoterapeuta?igsi=MXRsczZ3OGs2empwcg%3D%3D&utm_source=qr',
  facebook: 'https://www.facebook.com/share/14o1mcR5fnq/?mibextid=wwXIfr',
};

const GIORNI_SETTIMANA = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const GIORNI_LAVORO = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const TIPI_CHIUSURA = ['Festività','Vacanze','Ponte','Chiusura organizzata','Festività locale','Altro'];

const ICONS = {
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>',
  fb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v6h3v-6h2.5l.5-3H14V9z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>',
};

/* ============================================================================
   LETTURA / SCRITTURA DATI
   ============================================================================ */
let CURRENT_DATA = null;

async function loadAllData(){
  if(!SCRIPT_URL) return { studenti:[], chiusure:[], pagamenti:[], canzoni:[], annunci:[] };
  try{
    const res = await fetch(SCRIPT_URL);
    const raw = await res.json();
    return {
      studenti:  raw.Studenti  || [],
      chiusure:  raw.Chiusure  || [],
      pagamenti: raw.Pagamenti || [],
      canzoni:   raw.Canzoni   || [],
      annunci:   raw.Annunci   || [],
    };
  }catch(err){
    return { studenti:[], chiusure:[], pagamenti:[], canzoni:[], annunci:[], _errore:true };
  }
}
async function salvaRiga(action, data){
  if(!SCRIPT_URL) return { success:false, error:'Nessuno script collegato' };
  try{
    const res = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action, data }) });
    return await res.json();
  }catch(err){ return { success:false, error:String(err) }; }
}

/* ============================================================================
   DATE / CALENDARIO
   ============================================================================ */
function parseDataIt(str){
  if(!str) return null;
  str = String(str).trim();
  let m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
}
function fmtData(d){ return `${GIORNI_SETTIMANA[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`; }
function dentroChiusura(data, chiusure){
  return chiusure.some(c=>{
    const dal = parseDataIt(c['Dal (gg/mm/aaaa)'] || c['Dal']);
    const al  = parseDataIt(c['Al (gg/mm/aaaa)'] || c['Al']) || dal;
    if(!dal) return false;
    return data >= dal && data <= al;
  });
}
function generaOccorrenze(nomeGiorno, chiusure){
  const idx = GIORNI_SETTIMANA.indexOf(nomeGiorno);
  if(idx < 0) return [];
  const start = new Date(ANNO_INIZIO), end = new Date(ANNO_FINE);
  let d = new Date(start);
  while(d.getDay() !== idx) d.setDate(d.getDate()+1);
  const out = [];
  while(d <= end){ if(!dentroChiusura(d, chiusure)) out.push(new Date(d)); d.setDate(d.getDate()+7); }
  return out;
}

/* ============================================================================
   HELPERS
   ============================================================================ */
function nomeCompleto(s){ return `${(s['Nome Allievo']||'').trim()} ${(s['Cognome Allievo']||'').trim()}`.trim(); }
function linkFamiglia(nome){ const url = new URL(location.href); url.hash=''; url.search=''; url.searchParams.set('studente', nome); return url.toString(); }
function messaggioWhatsapp(genitore, allievo, link){
  return `Ciao ${genitore}, mamma/papà di ${allievo}! Questo è il tuo link personale per avere sempre sotto controllo calendario, pagamenti, canzoni e informazioni del corso di musica: ${link}\nPer qualsiasi dubbio resto a tua disposizione. A presto!\nLara`;
}
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function opt(list, selected){ return list.map(v=>`<option value="${v}" ${v===selected?'selected':''}>${v}</option>`).join(''); }
function copyBtnsSetup(root){
  root.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ navigator.clipboard.writeText(btn.dataset.copy); const old=btn.textContent; btn.textContent='Copiato ✓'; setTimeout(()=>btn.textContent=old,1500); });
  });
}

function socialFooterHtml(){
  return `
  <footer class="social-footer">
    <a href="${INFO.instagram}" target="_blank" rel="noopener">${ICONS.ig} Instagram</a>
    <a href="${INFO.facebook}" target="_blank" rel="noopener">${ICONS.fb} Facebook</a>
    <a href="mailto:${INFO.email}">${ICONS.mail} Email</a>
    <a href="tel:+39${INFO.telefono.replace(/\s/g,'')}">${ICONS.phone} ${INFO.telefono}</a>
  </footer>`;
}

/* ============================================================================
   ROUTER ADMIN — sezioni: home, dashboard, corsi, chiusure, studenti,
   importa, famiglie, pagamenti, canzoni, info, annunci, homefamiglia
   ============================================================================ */
const SEZIONI = [
  { id:'dashboard', label:'Dashboard' },
  { id:'corsi', label:'Corsi e Gruppi' },
  { id:'chiusure', label:'Chiusure' },
  { id:'studenti', label:'Studenti' },
  { id:'importa', label:'Importa allievi' },
  { id:'famiglie', label:'Famiglie e link' },
  { id:'pagamenti', label:'Pagamenti' },
  { id:'canzoni', label:'Canzoni' },
  { id:'informazioni', label:'Informazioni' },
  { id:'annunci', label:'Annunci' },
  { id:'homefamiglia', label:'Home famiglia' },
];

function adminRoute(){ return (location.hash || '#home').replace('#',''); }

async function refreshAdmin(){
  CURRENT_DATA = await loadAllData();
  paintAdmin();
}

function paintAdmin(){
  const route = adminRoute();
  const app = document.getElementById('app');
  if(route === 'home'){
    app.innerHTML = homeHtml() + socialFooterHtml();
    app.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=>{ location.hash = '#'+el.dataset.goto; }));
    return;
  }
  const body = sectionHtml(route, CURRENT_DATA);
  app.innerHTML = `

function sectionHtml(route, data){
  const { studenti, chiusure, pagamenti, canzoni, annunci } = data;
  const setupMancante = !SCRIPT_URL;
  const commonWarn = (setupMancante ? `<div class="setup-note">Nessuno script collegato. Incolla il link /exec dentro <code>SCRIPT_URL</code> in <code>app.js</code>.</div>` : (data._errore ? `<div class="setup-note">Non riesco a leggere i dati: controlla il link dello script.</div>` : ''));

  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const idxOggi = oggi.getDay();
  const corsiEsistenti = [...new Set(studenti.map(s=>s['Corso']).filter(Boolean))];
  const nomiStudentiOpt = studenti.map(nomeCompleto).filter(Boolean);

  if(route === 'dashboard'){
    const lezioniOggi = studenti.filter(s => s['Giorno'] && GIORNI_SETTIMANA.indexOf(String(s['Giorno']).trim())===idxOggi && oggi>=new Date(ANNO_INIZIO) && oggi<=new Date(ANNO_FINE) && !dentroChiusura(oggi, chiusure)).length;
    const prossimaChiusura = chiusure.map(c=>({...c,_dal:parseDataIt(c['Dal (gg/mm/aaaa)']||c['Dal'])})).filter(c=>c._dal && c._dal>=oggi).sort((a,b)=>a._dal-b._dal)[0];
    const pagamentiDaRicevere = pagamenti.filter(p=>String(p['Pagato (Sì/No)']||p['Pagato']||'').trim().toLowerCase().startsWith('n'));
    const calendariPubblicati = corsiEsistenti.length;
    const calendariDaControllare = studenti.filter(s=>!s['Giorno']||!s['Orario']).length;
    return `${commonWarn}
      <div class="section-head"><h2 style="font-family:var(--f-display);font-weight:600;color:var(--teal-ink);margin:0 0 20px">È tutto organizzato</h2></div>
      <div class="admin-grid">
        <div class="stat"><p class="stat-label">Studenti attivi</p><p class="stat-value">${studenti.length}</p></div>
        <div class="stat"><p class="stat-label">Lezioni oggi</p><p class="stat-value">${lezioniOggi}</p></div>
        <div class="stat"><p class="stat-label">Pagamenti da ricevere</p><p class="stat-value">${pagamentiDaRicevere.length}</p></div>
        <div class="stat"><p class="stat-label">Prossima chiusura</p><p class="stat-value" style="font-size:1.15rem">${prossimaChiusura?prossimaChiusura['Nome']:'—'}</p>${prossimaChiusura?`<p class="stat-sub">${fmtData(prossimaChiusura._dal)}</p>`:''}</div>
        <div class="stat"><p class="stat-label">Calendari pubblicati</p><p class="stat-value">${calendariPubblicati}</p></div>
        <div class="stat"><p class="stat-label">Calendari da controllare</p><p class="stat-value">${calendariDaControllare}</p></div>
      </div>
      <div class="section"><h2>Azioni rapide</h2>
        <div class="quick-actions">
          <button class="btn btn--solid" data-goto="studenti">+ Nuovo studente</button>
          <button class="btn btn--solid" data-goto="chiusure">+ Aggiungi chiusura</button>
          <button class="btn btn--solid" data-goto="pagamenti">+ Registra pagamento</button>
          <button class="btn btn--solid" data-goto="canzoni">+ Nuova canzone</button>
          <button class="btn btn--solid" data-goto="annunci">+ Nuova comunicazione</button>
        </div>
      </div>`;
  }

  if(route === 'corsi'){
    const gruppi = {};
    studenti.forEach(s=>{ if(!s['Giorno']||!s['Orario']) return; const k=`${s['Giorno']}|${s['Orario']}|${s['Corso']}`; (gruppi[k]=gruppi[k]||{giorno:s['Giorno'],orario:s['Orario'],corso:s['Corso'],sede:s['Sede'],n:0}).n++; });
    const perGiorno = {}; GIORNI_LAVORO.forEach(g=>perGiorno[g]=[]);
    Object.values(gruppi).forEach(g=>{ const key=String(g.giorno).trim(); if(perGiorno[key]) perGiorno[key].push(g); });
    Object.values(perGiorno).forEach(arr=>arr.sort((a,b)=>String(a.orario).localeCompare(String(b.orario))));
    return `${commonWarn}
      <div class="section"><h2>I tuoi corsi</h2><p class="section-note">Orario settimanale, generato dagli studenti iscritti (foglio Studenti).</p>
        <div class="week-grid">${GIORNI_LAVORO.map(g=>`
          <div class="week-col"><h4>${g.slice(0,3)}</h4>
            ${perGiorno[g].length ? perGiorno[g].map(sl=>`<div class="week-slot"><div class="w-time">${sl.orario}</div><div class="w-course">${sl.corso||''} (${sl.n})</div></div>`).join('') : '<p style="text-align:center;color:var(--ink-soft);font-size:.78rem">—</p>'}
          </div>`).join('')}</div>
      </div>`;
  }

  if(route === 'chiusure'){
    return `${commonWarn}
      <div class="section"><h2>Chiusure e ponti — anno 2026/27</h2>
        <form class="form-card" id="form-chiusura">
          <div class="f-row"><label>Nome<input name="Nome" required></label><label>Tipo<select name="Tipo">${opt(TIPI_CHIUSURA)}</select></label></div>
          <div class="f-row"><label>Dal<input name="Dal (gg/mm/aaaa)" type="date" required></label><label>Al<input name="Al (gg/mm/aaaa)" type="date"></label></div>
          <div class="f-row"><label>Note<input name="Note"></label></div>
          <button class="btn btn--solid" type="submit">Salva chiusura</button><span class="form-msg"></span>
        </form>
        ${chiusure.length?`<div class="table-list">${chiusure.map(c=>`<div class="table-row"><span class="t-main">${c['Nome']}</span><span class="t-sub">${c['Dal (gg/mm/aaaa)']||c['Dal']} → ${c['Al (gg/mm/aaaa)']||c['Al']}</span><span class="tag tag--ok">${c['Tipo']||'—'}</span></div>`).join('')}</div>`:`<div class="empty">Nessuna chiusura registrata.</div>`}
      </div>`;
  }

  if(route === 'studenti'){
    const gruppi = {};
    studenti.forEach(s=>{ const k = s['Corso']||'Corso da definire'; (gruppi[k]=gruppi[k]||[]).push(s); });
    return `${commonWarn}
      <div class="section"><h2>Nuovo studente</h2>
        <form class="form-card" id="form-studente">
          <div class="f-row"><label>Nome allievo<input name="Nome Allievo" required></label><label>Cognome allievo<input name="Cognome Allievo" required></label></div>
          <div class="f-row"><label>Nome genitore<input name="Nome Genitore" required></label><label>Email genitore<input name="Email Genitore" type="email"></label></div>
          <div class="f-row"><label>Telefono genitore<input name="Telefono Genitore"></label><label>Corso<input name="Corso" list="lista-corsi"><datalist id="lista-corsi">${corsiEsistenti.map(c=>`<option value="${escAttr(c)}">`).join('')}</datalist></label></div>
          <div class="f-row"><label>Giorno<select name="Giorno"><option value="">— da definire —</option>${opt(GIORNI_LAVORO)}</select></label><label>Orario<input name="Orario" placeholder="17:50"></label><label>Sede<input name="Sede"></label></div>
          <button class="btn btn--solid" type="submit">Aggiungi studente</button><span class="form-msg"></span>
        </form>
      </div>
      <div class="section"><h2>Studenti per corso</h2><p class="section-note">Clicca su un gruppo per vedere chi ne fa parte.</p>
        ${Object.keys(gruppi).length ? `<div class="group-list">${Object.entries(gruppi).map(([nome,arr],i)=>`
          <div class="group-card">
            <button class="group-head" data-toggle="grp-${i}"><span class="g-name">${nome}</span><span class="g-count">${arr.length} student${arr.length===1?'e':'i'}</span></button>
            <div class="group-body" id="grp-${i}">${arr.map(s=>`<div class="stu">${nomeCompleto(s)}${s['Giorno']?` — ${s['Giorno']} ${s['Orario']||''}`:' — orario da definire'}</div>`).join('')}</div>
          </div>`).join('')}</div>` : `<div class="empty">Nessuno studente ancora.</div>`}
      </div>`;
  }

  if(route === 'importa'){
    return `${commonWarn}
      <div class="section"><h2>Importa allievi da Excel</h2>
        <p class="section-note">Carica un file .xlsx o .csv con le colonne: Nome Allievo, Cognome Allievo, Nome Genitore, Email Genitore, Telefono Genitore, Corso, Giorno, Orario, Sede.</p>
        <div class="form-card">
          <input type="file" id="import-file" accept=".xlsx,.csv">
          <button class="btn btn--solid" id="import-btn" type="button">Importa</button>
          <span class="form-msg" id="import-msg"></span>
        </div>
      </div>`;
  }

  if(route === 'famiglie'){
    const famiglie = {};
    studenti.forEach(s=>{ const key=(s['Nome Genitore']||'')+'|'+(s['Email Genitore']||''); (famiglie[key]=famiglie[key]||{genitore:s['Nome Genitore']||'—',figli:[]}).figli.push(s); });
    const lista = Object.values(famiglie);
    return `${commonWarn}
      <div class="section"><h2>Famiglie & link</h2><p class="section-note">Link personale e messaggio WhatsApp pronti da copiare.</p>
        ${lista.length?`<div class="family-list">${lista.map(f=>{ const primo=nomeCompleto(f.figli[0]); const link=linkFamiglia(primo); const msg=messaggioWhatsapp(f.genitore,f.figli.map(nomeCompleto).join(' e '),link);
          return `<div class="family-card"><div><div class="fam-name">${f.genitore}</div><div class="fam-kids">${f.figli.map(s=>`${nomeCompleto(s)} — ${s['Corso']||'corso da definire'}`).join(' · ')}</div></div>

function wireGroupToggles(root){
  root.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const body = document.getElementById(btn.dataset.toggle);
      body.classList.toggle('is-open');
    });
  });
}

function formatDateFields(campi){ return (fd)=>{ campi.forEach(c=>{ if(fd[c]){ const [y,m,d]=fd[c].split('-'); fd[c]=`${d}/${m}/${y}`; } }); return fd; }; }

function wireForms(root){
  collegaForm(root,'form-studente','addStudente');
  collegaForm(root,'form-chiusura','addChiusura', formatDateFields(['Dal (gg/mm/aaaa)','Al (gg/mm/aaaa)']));
  collegaForm(root,'form-pagamento','addPagamento', formatDateFields(['Scadenza (gg/mm/aaaa)']));
  collegaForm(root,'form-canzone','addCanzone');
  collegaForm(root,'form-annuncio','addAnnuncio', (fd)=>{ fd['Importante (Sì/No)']=fd['__importante']?'Sì':'No'; delete fd['__importante']; return fd; });
}

function collegaForm(root, id, action, trasforma){
  const form = root.querySelector('#'+id);
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = form.querySelector('.form-msg');
    const fd = Object.fromEntries(new FormData(form).entries());
    form.querySelectorAll('input[type=checkbox]').forEach(cb=>{ fd[cb.name] = cb.checked ? 'on' : ''; });
    const dati = trasforma ? trasforma(fd) : fd;
    msg.textContent = 'Salvataggio...';
    const risposta = await salvaRiga(action, dati);
    if(risposta.success){ msg.textContent = 'Salvato ✓'; form.reset(); await refreshAdmin(); }
    else msg.textContent = 'Errore: ' + (risposta.error || 'riprova');
  });
}

function wireImportForm(root){
  const btn = root.querySelector('#import-btn');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    const fileInput = root.querySelector('#import-file');
    const msg = root.querySelector('#import-msg');
    const file = fileInput.files[0];
    if(!file){ msg.textContent = 'Scegli prima un file.'; return; }
    msg.textContent = 'Lettura file...';
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const righe = XLSX.utils.sheet_to_json(sheet, { defval:'' });
    let ok = 0, ko = 0;
    for(const r of righe){
      msg.textContent = `Importazione ${ok+ko+1} di ${righe.length}...`;
      const res = await salvaRiga('addStudente', r);
      if(res.success) ok++; else ko++;
    }
    msg.textContent = `Fatto: ${ok} importati${ko?`, ${ko} con errore`:''}.`;
    await refreshAdmin();
  });
}

function renderFamiglia(data, nomeStudente){
  const { studenti, chiusure, pagamenti, canzoni, annunci } = data;

    app.innerHTML = `<div class="shell"><div class="topbar"><div class="brand"><span class="eyebrow">MusiCare</span><h1>Home famiglia</h1></div></div><div class="empty">Non troviamo questo link. Scrivi a <a href="mailto:${INFO.email}">${INFO.email}</a>.</div></div>${socialFooterHtml()}`;
    return;
  }

  const primoNome = (iscrizioni[0]['Nome Allievo']||'').trim();
  const corsiStudente = iscrizioni.map(s=>s['Corso']).filter(Boolean);
  const nomiCompletiStudente = iscrizioni.map(nomeCompleto);
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  let prossima = null;
  iscrizioni.forEach(s=>{
    if(!s['Giorno']) return;
    const occ = generaOccorrenze(String(s['Giorno']).trim(), chiusure).filter(d=>d>=oggi);
    if(occ.length && (!prossima || occ[0] < prossima.data)) prossima = { data:occ[0], corso:s['Corso'], orario:s['Orario'], sede:s['Sede'] };
  });

  const annunciRilevanti = annunci.filter(a=>{ const dest=(a['Destinatari (Tutti/Corso)']||a['Destinatari']||'Tutti').trim(); return dest==='Tutti' || corsiStudente.includes(a['Corso (se Destinatari=Corso)']||a['Corso']); });
  const annunciImportanti = annunciRilevanti.filter(a=>String(a['Importante (Sì/No)']||'').toLowerCase().startsWith('s'));
  const canzoniStudente = canzoni.filter(c=>{ const vis=(c['Visibilità (Tutti/Corso)']||c['Visibilità']||'Tutti').trim(); return vis==='Tutti' || corsiStudente.includes(c['Corso (se Visibilità=Corso)']||c['Corso']); });
  const pagamentiStudente = pagamenti.filter(p => nomiCompletiStudente.some(n => n.toLowerCase() === String(p['Studente (Nome Cognome)']||p['Studente']||'').trim().toLowerCase()));

      <div class="tab-panel is-active" id="panel-home">
        ${prossima ? `<div class="next-lesson"><p class="nl-label">Prossima lezione</p><p class="nl-date">${fmtData(prossima.data)}${prossima.orario?' · '+prossima.orario:''}</p><p class="nl-course">${prossima.corso||''}${prossima.sede?' — '+prossima.sede:''}</p></div>` : ''}
        ${annunciImportanti.map(a=>`<div class="announce"><h3>${a['Titolo']}</h3><p>${a['Testo']}</p></div>`).join('')}
        <div class="section"><h2>Le tue iscrizioni</h2>${iscrizioni.map(s=>`<div class="enroll-card"><span class="e-course">${s['Corso']||'Corso da definire'}</span><p style="margin:4px 0 0" class="t-sub">${s['Giorno']&&s['Orario']?`${s['Giorno']} · ${s['Orario']} — ${s['Sede']||''} · Confermato`:'In fase di conferma'}</p></div>`).join('')}</div>
      </div>

      <div class="tab-panel" id="panel-calendario">${renderCalendarioGrid(iscrizioni, chiusure)}</div>

      <div class="tab-panel" id="panel-pagamenti">
        ${pagamentiStudente.length ? pagamentiStudente.map(p=>{
          const pagato = String(p['Pagato (Sì/No)']||p['Pagato']||'').trim().toLowerCase().startsWith('s');
          return `<div class="pay-card ${pagato?'':'is-due'}"><div><div class="p-name">${p['Rata/Periodo']}</div><div class="p-sub">€ ${p['Importo (€)']||p['Importo']} — scadenza ${p['Scadenza (gg/mm/aaaa)']||p['Scadenza']}</div></div><span class="tag ${pagato?'tag--ok':'tag--warn'}">${pagato?'Pagato':'Da pagare'}</span></div>`;

      <div class="tab-panel" id="panel-info">
        <div class="info-block"><h3>Come funzionano i pagamenti</h3><p>Se non hai ancora effettuato l'iscrizione e il pagamento del corso puoi farlo qui: <a href="${INFO.formPagamento}" target="_blank" rel="noopener">modulo iscrizioni</a>.</p><p>Una volta ricevuto il messaggio con l'importo specifico, versalo su questo IBAN: <strong>${INFO.iban}</strong> intestato a <strong>${INFO.intestatario}</strong>, causale: nome e cognome dell'allievo.</p></div>

      </div>
    </div>
    ${socialFooterHtml()}
  `;

  app.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click', ()=>{
    app.querySelectorAll('.tab').forEach(b=>b.classList.remove('is-active'));

    btn.classList.add('is-active'); document.getElementById('panel-'+btn.dataset.tab).classList.add('is-active');
    window.scrollTo({top:0, behavior:'smooth'});
  }));
}

function renderCalendarioGrid(iscrizioni, chiusure){
  const perCorso = iscrizioni.map(s=> s['Giorno'] ? { corso:s['Corso'], orario:s['Orario'], occ:generaOccorrenze(String(s['Giorno']).trim(), chiusure) } : null).filter(Boolean);
  if(!perCorso.length) return `<div class="empty">Il calendario apparirà qui appena il tuo corso avrà giorno e orario confermati.</div>`;

  const lezioniPerGiorno = {}; // "y-m-d" -> [{orario,corso}]
  perCorso.forEach(p=> p.occ.forEach(d=>{ const k=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; (lezioniPerGiorno[k]=lezioniPerGiorno[k]||[]).push({orario:p.orario, corso:p.corso}); }));

  const start = new Date(ANNO_INIZIO), end = new Date(ANNO_FINE);
  let html = '';
  let cursore = new Date(start.getFullYear(), start.getMonth(), 1);
  while(cursore <= end){
    const y = cursore.getFullYear(), m = cursore.getMonth();
    const primoGiorno = new Date(y,m,1);
    const ultimoGiorno = new Date(y,m+1,0);
    let offset = primoGiorno.getDay(); offset = offset===0?6:offset-1; // lunedì=0
    let celle = '';
    for(let i=0;i<offset;i++) celle += `<div class="cal-cell empty-cell"></div>`;
    for(let day=1; day<=ultimoGiorno.getDate(); day++){
      const key = `${y}-${m}-${day}`;
      const lezioni = lezioniPerGiorno[key];
      if(lezioni){
        celle += `<div class="cal-cell has-lesson"><span class="cc-day">${day}</span><span class="cc-time">${lezioni[0].orario||''}</span></div>`;
      } else {
        celle += `<div class="cal-cell"><span class="cc-day">${day}</span></div>`;
      }
    }
    html += `<div class="cal-month"><h3>${MESI[m]} ${y}</h3><div class="cal-grid">
      ${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${celle}
    </div></div>`;
    cursore.setMonth(cursore.getMonth()+1);
  }
  return html;
}
